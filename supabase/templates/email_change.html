<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#F7F5EF;font-family:Manrope,Segoe UI,Helvetica,Arial,sans-serif;color:#202A24;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #DEE3DA;border-radius:12px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 24px;font-size:18px;font-weight:700;color:#214E3B;">CartaLista</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Confirmá tu nuevo email</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#202A24;">Pediste cambiar el email de tu cuenta de CartaLista a {{ .NewEmail }}.</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next={{ .RedirectTo }}" style="display:inline-block;background:#214E3B;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:16px;padding:12px 20px;border-radius:8px;">Confirmar cambio</a>
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#626B64;">Si no lo pediste vos, ignorá este mensaje.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
